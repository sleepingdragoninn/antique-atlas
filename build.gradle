//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyAccessibility
plugins {
	id "maven-publish"
	alias libs.plugins.loom
	alias libs.plugins.githubRelease
	alias libs.plugins.minotaur
	alias libs.plugins.curse
}

version = "$baseVersion+$branch"
base.archivesName = project.slug

repositories {
	maven { url = "https://repo.sleeping.town/" }
	maven { url = "https://repo.codemc.io/repository/relativitymc/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
	mavenLocal()
}

// Dev only: modern-yarn without parameter names, so the dev jar keeps the Mojang parameter names Fabric API mixins match on.
def modernYarnWithoutParams() {
	def jar = configurations.detachedConfiguration(dependencies.create("org.relativitymc:modern-yarn:${libs.versions.yarn.get()}:v2")).singleFile
	def out = file("build/mappings/modern-yarn-${libs.versions.yarn.get()}-noparams.tiny")
	if (!out.exists() || out.lastModified() < jar.lastModified()) {
		out.parentFile.mkdirs()
		def lines = zipTree(jar).matching { include "mappings/mappings.tiny" }.singleFile.readLines("UTF-8")
		def kept = []
		boolean skipping = false
		for (line in lines) {
			if (line.startsWith("\t\tp\t")) { skipping = true; continue }
			if (skipping && line.startsWith("\t\t\tc\t")) continue
			skipping = false
			kept.add(line)
		}
		out.setText(kept.join("\n") + "\n", "UTF-8")
	}
	return out
}

dependencies {
	implementation libs.kaleidoConfig

	minecraft libs.mc
	mappings loom.layered {
		mappings(modernYarnWithoutParams())
	}
	modImplementation libs.fl

	modImplementation libs.fapi

	modImplementation libs.surveyor
	modCompileOnly libs.modmenu
}

processResources {
	final Map<String, String> meta = [
		version       : version,
		modId         : modId,
		modName       : modName,
		modDescription: modDescription,
		homepage      : "https://modrinth.com/mod/${slug}",
		issues        : "https://github.com/${user}/${slug}/issues",
		sources       : "https://github.com/${user}/${slug}",
		license       : license,
		authors       : authors.split(", ").join("\",\n    \""),
		contributors  : contributors.split(", ").join("\",\n    \""),
		members       : "${authors}. Contributions by ${contributors}",
		mc            : compatibleVersions.split(", ")[0],
		fl            : libs.versions.fl.get(),
		fapi          : libs.versions.fapi.get(),
		surveyor      : libs.versions.surveyor.get(),
	]
	inputs.properties(meta)
	filesMatching("*.mod.json") { expand(meta) }
	filesMatching("META-INF/*mods.toml") { expand(meta) }
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "antique_atlas_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = false
	}
}

// In-game tests run against the production game: the yarn dev environment cannot host a world on 26.x.
configurations {
	productionMods { transitive = false }
}

dependencies {
	productionMods libs.fapi
	productionMods libs.surveyor
	productionMods libs.modmenu
	// Not bundled in the production Fabric API jar; version as resolved by libs.fapi.
	productionMods "net.fabricmc.fabric-api:fabric-client-gametest-api-v1:5.1.0+0a5283664c"
}

tasks.register("gametestJar", Jar) {
	from sourceSets.gametest.output
	archiveClassifier = "gametest-dev"
}

tasks.register("remapGametestJar", net.fabricmc.loom.task.RemapJarTask) {
	inputFile = tasks.named("gametestJar", Jar).flatMap { it.archiveFile }
	classpath.from(sourceSets.gametest.compileClasspath)
	addNestedDependencies = false
	archiveClassifier = "gametest"
}

tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "verification"
	description = "Runs the client gametests against the production game with the remapped jar."
	mods.from(tasks.named("remapJar"), tasks.named("remapGametestJar"), configurations.productionMods)
	runDir = file("build/run/prodClientGameTest")
	jvmArgs.add("-Dfabric.client.gametest=true")
	programArgs.addAll("--width", "1280", "--height", "720")
}

loom {
	useIntermediateMappings = true
	intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
}

publishing {
	repositories {
		maven {
			name 'SleepingTown'
			url 'https://repo-api.sleeping.town/'
			credentials(PasswordCredentials)
		}
	}

	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}

githubRelease {
	token = "$System.env.GITHUB_TOKEN"
	owner = project.user
	repo = slug
	tagName = "v${baseVersion}+${tagBranch}"
	targetCommitish = tagBranch
	releaseAssets = remapJar
	releaseName = "v${baseVersion}"
	allowUploadToExisting = true
	generateReleaseNotes = true
	body = !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text
}

modrinth {
	token = "$System.env.MODRINTH_TOKEN"
	projectId = modrinthSlug
	versionNumber = project.version
	uploadFile = remapJar
	gameVersions = compatibleVersions.split(", ").toList()
	loaders = compatibleLoaders.split(", ").toList()
	changelog = !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text + "\n\nChangelog: https://github.com/${user}/${slug}/releases/tag/v${baseVersion}+${tagBranch}"
	syncBodyFrom = rootProject.file("README.md").text
	dependencies {
		required.version libs.fapi.get().getName(), libs.versions.fapi.get()
		required.version libs.surveyor.get().getName(), libs.versions.surveyor.get()
		required.project "mcqoy"
		optional.project "modmenu"
	}
}

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	apiToken = "$System.env.CURSEFORGE_TOKEN"
	disableVersionDetection()
	def projectId = "1391589"
	def mainFile = upload(projectId, remapJar)
	compatibleLoaders.split(", ").toList().forEach { mainFile.addModLoader(it) }
	compatibleVersions.split(", ").toList().forEach { mainFile.addGameVersion(it) }
	mainFile.addEnvironment("client")
	mainFile.addRequirement(libs.fapi.get().getName())
	mainFile.addRequirement("surveyor-map-framework")
	mainFile.addRequirement("mcqoy")
	mainFile.changelog = !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text + "\n\nChangelog: https://github.com/${user}/${slug}/releases/tag/v${baseVersion}+${tagBranch}"
	mainFile.changelogType = "markdown"
	mainFile.releaseType = "release"
}

tasks.register("fullRelease") {
	group "publishing"
	dependsOn "githubRelease"
	dependsOn "publish"
	dependsOn "modrinth"
	dependsOn "curseforge"
}
